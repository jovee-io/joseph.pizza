<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>joseph.pizza</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #060608; overflow: hidden; }
    canvas { display: block; image-rendering: pixelated; }
    #slit-marker {
      position: fixed; top: 0; width: 1px; height: 100%;
      background: rgba(255,255,255,0.05); pointer-events: none;
    }
  </style>
</head>
<body>
<div id="slit-marker"></div>
<canvas id="main"></canvas>
<script>
  const canvas = document.getElementById('main');
  const ctx    = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const W = canvas.width;
  const H = canvas.height;
  const slitMarker = document.getElementById('slit-marker');

  // =====================================================
  // PARAMETERS
  // =====================================================
  const MIN_PIZZAS   = 2;
  const MAX_PIZZAS   = 9;
  const PIZZA_RADIUS = 100;
  const NOISE_AMOUNT = 28;
  const BG_COLOR     = '#060608';
  const SLIT_X       = Math.floor(W * 0.35);

  // =====================================================
  // HELPERS
  // =====================================================
  function randInt(a, b)   { return Math.floor(a + Math.random() * (b - a)); }

  function makeSmoother(speed, lo=20, hi=80) {
    let cur=0, tgt=0, timer=0;
    return () => {
      if (--timer <= 0) { tgt = Math.random()*2-1; timer = randInt(lo,hi); }
      cur += (tgt-cur)*speed;
      return cur;
    };
  }

  // =====================================================
  // NEON PALETTES
  // =====================================================
  const NEON_HUES = [
    [300,330],[170,200],[50,80],[260,290],[10,35],[120,150],[220,250]
  ];

  function makeNeonPalette() {
    const hues  = NEON_HUES[randInt(0, NEON_HUES.length)];
    const h     = randInt(hues[0], hues[1]);
    const h2    = (h + randInt(40,100)) % 360;
    return {
      crust:      `hsl(${h},100%,55%)`,
      crustRing:  `hsl(${h},100%,28%)`,
      sauce:      `hsl(${h2},100%,50%)`,
      cheese:     `hsl(${(h+15)%360},100%,65%)`,
      cheeseBlob: `hsl(${(h+25)%360},100%,75%)`,
      pepperoni:  `hsl(${(h2+40)%360},90%,62%)`,
      outline:    `hsl(${h},80%,12%)`,
    };
  }

  // =====================================================
  // WOBBLE PATH HELPER
  // Builds a closed path that looks like a hand-drawn circle —
  // radius displaced by smooth noise at each angle step.
  // wobbleSeeds is an array of random values baked in per-pizza
  // so the shape is consistent but unique to each pizza.
  // =====================================================
  function wobblePath(ctx, cx, cy, r, seeds, wobbleAmt, steps=80) {
    ctx.beginPath();
    for (let i=0; i<=steps; i++) {
      const t     = i / steps;
      const angle = t * Math.PI * 2;
      // Layer two sine frequencies using the seeds for phase offsets
      const disp  = wobbleAmt * (
        Math.sin(angle * 3 + seeds[0]) * 0.5 +
        Math.sin(angle * 7 + seeds[1]) * 0.3 +
        Math.sin(angle * 2 + seeds[2]) * 0.2
      );
      const rr = r + disp;
      const x  = cx + Math.cos(angle) * rr;
      const y  = cy + Math.sin(angle) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // =====================================================
  // DRAW PIZZA
  // =====================================================
  function drawPizza(ctx, cx, cy, r, p) {

    // Each pizza gets baked-in wobble seeds so its shape is
    // consistent each time it's drawn but unique to this pizza
    const seeds = p.wobbleSeeds;

    // ----- Drop shadow (minimal) -----
    ctx.save();
    ctx.shadowColor   = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur    = 18;
    ctx.shadowOffsetX = 6;
    ctx.shadowOffsetY = 8;
    wobblePath(ctx, cx, cy, r, seeds, r * 0.06);
    ctx.fillStyle = 'rgba(0,0,0,0.01)'; // just enough to trigger shadow
    ctx.fill();
    ctx.restore();

    // ----- Crust fill (wobbled) -----
    wobblePath(ctx, cx, cy, r, seeds, r * 0.06);
    ctx.fillStyle = p.crust;
    ctx.fill();

    // ----- Crust ring — thick stroke on the wobbled path -----
    wobblePath(ctx, cx, cy, r, seeds, r * 0.06);
    ctx.strokeStyle = p.crustRing;
    ctx.lineWidth   = 14;
    ctx.stroke();

    // ----- Crust outline -----
    wobblePath(ctx, cx, cy, r, seeds, r * 0.06);
    ctx.strokeStyle = p.outline;
    ctx.lineWidth   = 3;
    ctx.stroke();

    // ----- 3D crust shading — radial gradient from upper-left -----
    // Light source is upper-left; crust gets a bright spot there
    // and darkens toward lower-right
    wobblePath(ctx, cx, cy, r, seeds, r * 0.06);
    const crustGrad = ctx.createRadialGradient(
      cx - r * 0.35, cy - r * 0.35, r * 0.05,  // highlight center
      cx, cy, r
    );
    crustGrad.addColorStop(0,   'rgba(255,255,255,0.22)');
    crustGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
    crustGrad.addColorStop(1,   'rgba(0,0,0,0.28)');
    ctx.fillStyle = crustGrad;
    ctx.fill();

    // ----- Sauce (slightly wobbled inward) -----
    wobblePath(ctx, cx, cy * 1.0, r * 0.82, seeds, r * 0.05);
    ctx.fillStyle = p.sauce;
    ctx.fill();

    // ----- Cheese base -----
    wobblePath(ctx, cx, cy, r * 0.78, seeds, r * 0.04);
    ctx.fillStyle = p.cheese;
    ctx.fill();

    // ----- Cheese blobs -----
    [{dx:-.2,dy:-.3,rx:.28,ry:.18,a:.4},{dx:.3,dy:.1,rx:.22,ry:.16,a:-.3},
     {dx:-.1,dy:.35,rx:.25,ry:.14,a:.8},{dx:.1,dy:-.1,rx:.3,ry:.2,a:.1}]
    .forEach(b => {
      ctx.save(); ctx.translate(cx+r*b.dx, cy+r*b.dy); ctx.rotate(b.a);
      ctx.beginPath(); ctx.ellipse(0,0,r*b.rx,r*b.ry,0,0,Math.PI*2);
      ctx.fillStyle=p.cheeseBlob; ctx.fill(); ctx.restore();
    });

    // ----- 3D cheese shading -----
    wobblePath(ctx, cx, cy, r * 0.78, seeds, r * 0.04);
    const cheeseGrad = ctx.createRadialGradient(
      cx - r * 0.3, cy - r * 0.3, r * 0.05,
      cx, cy, r * 0.78
    );
    cheeseGrad.addColorStop(0,   'rgba(255,255,255,0.18)');
    cheeseGrad.addColorStop(0.6, 'rgba(0,0,0,0)');
    cheeseGrad.addColorStop(1,   'rgba(0,0,0,0.2)');
    ctx.fillStyle = cheeseGrad;
    ctx.fill();

    // ----- Slice lines -----
    for(let i=0;i<6;i++){
      const a=(i/6)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.cos(a)*r*.95, cy+Math.sin(a)*r*.95);
      ctx.strokeStyle=p.outline; ctx.lineWidth=2; ctx.stroke();
    }

    // ----- Pepperoni -----
    const pepCount      = randInt(5, 14);
    const maxPlaceRadius = r * 0.68;
    const placed = [];
    let attempts = 0;
    while (placed.length < pepCount && attempts < 200) {
      attempts++;
      const dist    = Math.sqrt(Math.random()) * maxPlaceRadius;
      const angle   = Math.random() * Math.PI * 2;
      const px      = cx + Math.cos(angle) * dist;
      const py      = cy + Math.sin(angle) * dist;
      const pr      = r * (0.07 + Math.random() * 0.09);
      const squashX = 0.7 + Math.random() * 0.6;
      const squashY = 0.7 + Math.random() * 0.6;
      const tilt    = Math.random() * Math.PI;
      const tooClose = placed.some(q => {
        const dx=px-q.px, dy=py-q.py;
        return Math.sqrt(dx*dx+dy*dy) < pr+q.pr+2;
      });
      if (!tooClose) placed.push({ px, py, pr, squashX, squashY, tilt });
    }

    placed.forEach(({ px, py, pr, squashX, squashY, tilt }) => {
      // Shadow
      ctx.save(); ctx.translate(px+2, py+2); ctx.rotate(tilt);
      ctx.beginPath(); ctx.ellipse(0,0,pr*squashX,pr*squashY,0,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fill(); ctx.restore();

      // Main disc
      ctx.save(); ctx.translate(px,py); ctx.rotate(tilt);
      ctx.beginPath(); ctx.ellipse(0,0,pr*squashX,pr*squashY,0,0,Math.PI*2);
      ctx.fillStyle=p.pepperoni; ctx.fill();

      // 3D shading on pepperoni
      const pepGrad = ctx.createRadialGradient(-pr*.25,-pr*.25,pr*.05, 0,0,pr);
      pepGrad.addColorStop(0,   'rgba(255,255,255,0.30)');
      pepGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
      pepGrad.addColorStop(1,   'rgba(0,0,0,0.35)');
      ctx.fillStyle = pepGrad; ctx.fill();
      ctx.restore();

      // Outline
      ctx.save(); ctx.translate(px,py); ctx.rotate(tilt);
      ctx.beginPath(); ctx.ellipse(0,0,pr*squashX,pr*squashY,0,0,Math.PI*2);
      ctx.strokeStyle=p.outline; ctx.lineWidth=1.5; ctx.stroke();
      ctx.restore();
    });

    // ----- Specular highlight — the grease shine -----
    // A soft bright ellipse in the upper-left quadrant
    const shinGrad = ctx.createRadialGradient(
      cx - r*0.28, cy - r*0.28, 0,
      cx - r*0.28, cy - r*0.28, r*0.45
    );
    shinGrad.addColorStop(0,   'rgba(255,255,255,0.18)');
    shinGrad.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = shinGrad;
    ctx.beginPath();
    ctx.ellipse(cx - r*0.28, cy - r*0.28, r*0.45, r*0.32, -0.5, 0, Math.PI*2);
    ctx.fill();

    // ----- Noise texture -----
    const id=ctx.getImageData(Math.floor(cx-r-10),Math.floor(cy-r-10),Math.ceil(r*2+20),Math.ceil(r*2+20));
    const d=id.data;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]>0){
        const n=(Math.random()-.5)*NOISE_AMOUNT;
        d[i]=Math.min(255,Math.max(0,d[i]+n));
        d[i+1]=Math.min(255,Math.max(0,d[i+1]+n));
        d[i+2]=Math.min(255,Math.max(0,d[i+2]+n));
      }
    }
    ctx.putImageData(id,Math.floor(cx-r-10),Math.floor(cy-r-10));
  }

  // =====================================================
  // PIZZA OBJECTS
  // =====================================================
  const pSize = (PIZZA_RADIUS+30)*2;

  // Random vertical spawn point, full screen height, keeping the
  // pizza's offscreen canvas fully on-screen
  function randomY() {
    const margin = pSize / 2;
    return margin + Math.random() * Math.max(1, H - margin * 2);
  }

  function makePizza() {
    const off  = document.createElement('canvas');
    off.width  = pSize; off.height = pSize;
    const oCtx = off.getContext('2d');
    const r    = PIZZA_RADIUS + randInt(-18,18);
    const pal  = makeNeonPalette();
    // Bake in three random phase offsets that define this pizza's unique wobble shape
    pal.wobbleSeeds = [Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2];
    drawPizza(oCtx, pSize/2, pSize/2, r, pal);
    return {
      off, oCtx, r, pal,
      y: randomY(),
      x: -pSize/2 - randInt(0, W),
      speedNoise: makeSmoother(0.025+Math.random()*.02, 15, 70),
    };
  }

  const pizzas = Array.from(
    {length: randInt(MIN_PIZZAS, MAX_PIZZAS + 1)},
    () => makePizza()
  );

  // =====================================================
  // TAPESTRY CANVAS
  // This is the slit scan output — a single offscreen canvas
  // the full width of the screen. Each frame we:
  //   1. Shift the entire tapestry one pixel to the right
  //   2. Plant the new slit column at the left edge (SLIT_X + 1)
  // Columns that drift off the right edge just disappear.
  // =====================================================
  const tapestry    = document.createElement('canvas');
  tapestry.width    = W;
  tapestry.height   = H;
  const tapestryCtx = tapestry.getContext('2d');

  // Fill with background to start
  tapestryCtx.fillStyle = BG_COLOR;
  tapestryCtx.fillRect(0, 0, W, H);

  // Temp canvas — composite live pizza feed for slit sampling
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width  = W;
  tempCanvas.height = H;
  const tempCtx     = tempCanvas.getContext('2d');

  // =====================================================
  // MAIN LOOP
  // =====================================================
  function frame() {

    slitMarker.style.left = SLIT_X + 'px';

    // --- Draw all pizzas to temp canvas (live feed) ---
    tempCtx.clearRect(0, 0, W, H);

    // Occasionally let the population grow, up to the cap
    if (pizzas.length < MAX_PIZZAS && Math.random() < 0.006) {
      pizzas.push(makePizza());
    }

    // Iterate backwards so we can retire pizzas mid-loop without
    // disturbing indices we haven't visited yet
    for (let i = pizzas.length - 1; i >= 0; i--) {
      const p = pizzas[i];
      const speed = Math.max(0.15, 0.6 + p.speedNoise() * 2.2);
      p.x += speed;

      if (p.x - p.r > W + 30) {
        // Pizza finished its run — either retire it (shrinking the
        // population) or send it around again from a fresh spot
        if (pizzas.length > MIN_PIZZAS && Math.random() < 0.35) {
          pizzas.splice(i, 1);
          continue;
        }
        p.x   = -pSize/2 - randInt(0, 80);
        p.y   = randomY();
        p.pal = makeNeonPalette();
        p.pal.wobbleSeeds = [Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2];
        p.oCtx.clearRect(0, 0, pSize, pSize);
        drawPizza(p.oCtx, pSize/2, pSize/2, p.r, p.pal);
      }

      tempCtx.drawImage(p.off, Math.floor(p.x - pSize/2), Math.floor(p.y - pSize/2));
    }

    // --- Update tapestry ---
    // Step 1: shift the entire tapestry one pixel to the right
    // We do this by drawing it onto itself offset by 1px
    tapestryCtx.drawImage(tapestry, 1, 0);

    // Step 2: clear the leftmost column of the tapestry (at SLIT_X)
    // so we have a clean slot to plant the new sample
    tapestryCtx.clearRect(SLIT_X, 0, 1, H);

    // Step 3: grab the slit column from the live feed and plant it
    const slitData = tempCtx.getImageData(SLIT_X, 0, 1, H);
    tapestryCtx.putImageData(slitData, SLIT_X, 0);

    // --- Composite to main canvas ---
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, W, H);

    // Draw tapestry (right side of slit)
    ctx.save();
    ctx.beginPath();
    ctx.rect(SLIT_X, 0, W - SLIT_X, H);
    ctx.clip();
    ctx.drawImage(tapestry, 0, 0);
    ctx.restore();

    // Draw live pizzas clipped strictly to left of slit
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, SLIT_X, H);
    ctx.clip();
    pizzas.forEach(p => {
      ctx.drawImage(p.off, Math.floor(p.x - pSize/2), Math.floor(p.y - pSize/2));
    });
    ctx.restore();

    // Ghost slit line
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(SLIT_X, 0, 1, H);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  window.addEventListener('resize', () => {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  });
</script>
</body>
</html>
