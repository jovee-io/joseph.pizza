<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>joseph.pizza</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #060608; overflow: hidden; }
    canvas { display: block; image-rendering: pixelated; }
    #slit-marker {
      position: fixed; top: 0; width: 1px; height: 100%;
      background: rgba(255,255,255,0.05); pointer-events: none;
    }
  </style>
</head>
<body>
<div id="slit-marker"></div>
<canvas id="main"></canvas>
<script>
  const canvas = document.getElementById('main');
  const ctx    = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  let W = canvas.width;
  let H = canvas.height;
  const slitMarker = document.getElementById('slit-marker');

  // =====================================================
  // PARAMETERS
  // =====================================================
  const MIN_PIZZAS   = 2;
  const MAX_PIZZAS   = 9;
  const PIZZA_RADIUS = 100;
  const NOISE_AMOUNT = 28;
  const BG_COLOR     = '#060608';
  let SLIT_X         = Math.floor(W * 0.35);

  // =====================================================
  // HELPERS
  // =====================================================
  function randInt(a, b)   { return Math.floor(a + Math.random() * (b - a)); }

  function makeSmoother(speed, lo=20, hi=80) {
    let cur=0, tgt=0, timer=0;
    return () => {
      if (--timer <= 0) { tgt = Math.random()*2-1; timer = randInt(lo,hi); }
      cur += (tgt-cur)*speed;
      return cur;
    };
  }

  // =====================================================
  // NEON PALETTES
  // =====================================================
  const NEON_HUES = [
    [300,330],[170,200],[50,80],[260,290],[10,35],[120,150],[220,250]
  ];

  function makeNeonPalette() {
    const hues  = NEON_HUES[randInt(0, NEON_HUES.length)];
    const h     = randInt(hues[0], hues[1]);
    const h2    = (h + randInt(40,100)) % 360;
    return {
      crust:      `hsl(${h},100%,55%)`,
      crustRing:  `hsl(${h},100%,28%)`,
      sauce:      `hsl(${h2},100%,50%)`,
      cheese:     `hsl(${(h+15)%360},100%,65%)`,
      cheeseBlob: `hsl(${(h+25)%360},100%,75%)`,
      pepperoni:  `hsl(${(h2+40)%360},90%,62%)`,
      outline:    `hsl(${h},80%,12%)`,
    };
  }

  // =====================================================
  // BOUNDARY GEOMETRY
  // Every pizza starts as a single closed curve — a deformed
  // ellipse — instead of a circle that gets transformed after the
  // fact. The ellipse axes encode the viewing angle (a squashed
  // minor axis reads as more edge-on), a "far pinch" compresses
  // the half of the curve representing the side of the disc
  // tilting away from camera (viewed slightly from above), and
  // per-point noise roughens the edge. Everything else — crust
  // band, sauce, cheese, slice lines, toppings — is built by
  // offsetting or sampling this one curve, so no two pizzas share
  // a shape and nothing is deformed after it's drawn.
  // =====================================================
  function buildBoundary(shape, steps = 90) {
    const { rx, ry, rot, farPinch, wobbleAmt, wobbleSeeds } = shape;
    const pts = [];
    for (let i = 0; i < steps; i++) {
      const t = (i / steps) * Math.PI * 2;

      // Base ellipse point in the pizza's own (unrotated) frame —
      // ry < rx is what reads as "tilted away from top-down"
      let ex = Math.cos(t) * rx;
      let ey = Math.sin(t) * ry;

      // Perspective cue: the half of the disc tilting away from
      // the camera (ey<0 here) compresses further, like the far
      // rim of a plate seen from slightly above
      if (ey < 0) ey *= (1 - farPinch);

      // Rotate into this pizza's random viewing direction
      const bx = ex * Math.cos(rot) - ey * Math.sin(rot);
      const by = ex * Math.sin(rot) + ey * Math.cos(rot);

      // Hand-drawn wobble — perturb the point's distance from the
      // origin along its own direction, using layered sine noise
      // keyed to the parametric angle so the curve stays closed
      const len = Math.hypot(bx, by) || 1;
      const ang = Math.atan2(by, bx);
      const disp = wobbleAmt * (
        Math.sin(t * 3 + wobbleSeeds[0]) * 0.5 +
        Math.sin(t * 7 + wobbleSeeds[1]) * 0.3 +
        Math.sin(t * 2 + wobbleSeeds[2]) * 0.2
      );
      const wobbled = Math.max(1, len + disp);
      pts.push({ x: Math.cos(ang) * wobbled, y: Math.sin(ang) * wobbled });
    }
    return pts;
  }

  // Centroid of a closed polygon — the standard area-weighted
  // (shoelace) formula. There's no browser built-in for "center of
  // an arbitrary curve"; this is the correct math for it.
  function polygonCentroid(pts) {
    let area = 0, cx = 0, cy = 0;
    for (let i = 0; i < pts.length; i++) {
      const p0 = pts[i], p1 = pts[(i + 1) % pts.length];
      const cross = p0.x * p1.y - p1.x * p0.y;
      area += cross;
      cx += (p0.x + p1.x) * cross;
      cy += (p0.y + p1.y) * cross;
    }
    area *= 0.5;
    if (Math.abs(area) < 1e-6) {
      const n = pts.length;
      return pts.reduce((a, p) => ({ x: a.x + p.x / n, y: a.y + p.y / n }), { x: 0, y: 0 });
    }
    return { x: cx / (6 * area), y: cy / (6 * area) };
  }

  // A smaller shape sharing every deformation parameter with the
  // original — same viewing rotation, same far-side pinch, same
  // wobble character — just at a reduced base radius. Building the
  // crust's inner edge and the cheese layer this way (regenerating
  // the same curve family, smaller) keeps their width visually
  // uniform all the way around and keeps them "in perspective"
  // with the outer edge. Shrinking each boundary point straight
  // toward the centroid instead reads unevenly wherever the curve
  // is tightly pinched or curved, since the centroid-to-point
  // direction there diverges from the curve's true local normal.
  function shrinkShape(shape, width) {
    const rx = Math.max(4, shape.rx - width);
    return {
      ...shape,
      rx,
      ry: Math.max(4, shape.ry - width * (shape.ry / shape.rx)),
      wobbleAmt: shape.wobbleAmt * (rx / shape.rx),
    };
  }

  // Tag each boundary point with its true angle from the centroid.
  // The curve's own parameter (t) does NOT advance at an even rate
  // in real angle once it's been squashed/pinched/rotated — sampling
  // by parameter fraction was landing slice lines and toppings at
  // the wrong angular spot. This is what real angle lookups need.
  function withAngles(pts, centroid) {
    return pts.map(p => ({
      x: p.x, y: p.y,
      angle: Math.atan2(p.y - centroid.y, p.x - centroid.x),
    }));
  }

  // Where the ray from the centroid at `angle` actually crosses the
  // boundary — found by locating the pair of angle-tagged points
  // that bracket it and interpolating between them. This is what
  // makes slice lines and topping placement land exactly on the
  // boundary in the requested direction, respecting its real shape
  // instead of an arbitrary point along its parametric curve.
  function pointAtAngle(indexed, angle) {
    const n = indexed.length;
    const twoPi = Math.PI * 2;
    const norm = a => ((a % twoPi) + twoPi) % twoPi;
    const target = norm(angle);
    for (let i = 0; i < n; i++) {
      const p0 = indexed[i], p1 = indexed[(i + 1) % n];
      const a0 = norm(p0.angle);
      let span = norm(p1.angle) - a0;
      if (span <= 0) span += twoPi;
      let d = target - a0;
      if (d < 0) d += twoPi;
      if (d <= span) {
        const frac = span === 0 ? 0 : d / span;
        return { x: p0.x + (p1.x - p0.x) * frac, y: p0.y + (p1.y - p0.y) * frac };
      }
    }
    return { x: indexed[0].x, y: indexed[0].y };
  }

  // =====================================================
  // PIZZA RECIPES
  // A recipe bundles every randomized rule that defines one
  // pizza: its palette, its topping count, and its shape — the
  // ellipse axes, viewing rotation, far-side pinch and wobble that
  // together define its unique boundary curve. New randomized
  // traits belong here, in one place.
  // =====================================================
  const MIN_SQUASH    = 0.32; // ry/rx — 1 = top-down circle, lower = more edge-on
  const MAX_SQUASH    = 0.95;
  const MIN_FAR_PINCH = 0.10; // extra compression on the far side of the curve
  const MAX_FAR_PINCH = 0.35;

  function makePizzaRecipe() {
    const pal   = makeNeonPalette();
    const baseR = PIZZA_RADIUS + randInt(-18, 18);
    return {
      pal,
      pepperoniCount: randInt(5, 14),
      shape: {
        rx: baseR,
        ry: baseR * (MIN_SQUASH + Math.random() * (MAX_SQUASH - MIN_SQUASH)),
        rot: Math.random() * Math.PI * 2,
        farPinch: MIN_FAR_PINCH + Math.random() * (MAX_FAR_PINCH - MIN_FAR_PINCH),
        wobbleAmt: baseR * (0.05 + Math.random() * 0.05),
        wobbleSeeds: [Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2],
      },
    };
  }

  // =====================================================
  // DRAW PIZZA
  // Builds the outer boundary curve first, finds its centroid,
  // then derives every other layer (crust band, sauce, cheese,
  // slice lines, topping placement) by offsetting or sampling
  // that one curve.
  // =====================================================
  function drawPizza(ctx, cx, cy, recipe) {
    const { pal, shape, pepperoniCount } = recipe;

    const outer       = buildBoundary(shape);
    const centroid    = polygonCentroid(outer);
    const crustShape  = shrinkShape(shape, shape.rx * 0.12);
    const crustIn     = buildBoundary(crustShape);
    const cheeseShape = shrinkShape(crustShape, shape.rx * 0.04);
    const cheese      = buildBoundary(cheeseShape);
    const maxR        = outer.reduce((m, p) => Math.max(m, Math.hypot(p.x - centroid.x, p.y - centroid.y)), 0);

    const toWorld  = p => ({ x: cx + p.x, y: cy + p.y });
    const world    = toWorld(centroid);
    const pathFrom = pts => {
      ctx.beginPath();
      pts.forEach((p, i) => {
        const w = toWorld(p);
        i === 0 ? ctx.moveTo(w.x, w.y) : ctx.lineTo(w.x, w.y);
      });
      ctx.closePath();
    };

    // ----- Drop shadow (minimal) -----
    ctx.save();
    ctx.shadowColor   = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur    = 18;
    ctx.shadowOffsetX = 6;
    ctx.shadowOffsetY = 8;
    pathFrom(outer);
    ctx.fillStyle = 'rgba(0,0,0,0.01)'; // just enough to trigger shadow
    ctx.fill();
    ctx.restore();

    // ----- Crust fill -----
    pathFrom(outer);
    ctx.fillStyle = pal.crust;
    ctx.fill();

    // ----- Crust ring — filled band between the outer edge and
    // its inward offset, traced as one path (outer forward, inner
    // reversed) so the nonzero winding rule punches the hole -----
    ctx.beginPath();
    outer.forEach((p, i) => {
      const w = toWorld(p);
      i === 0 ? ctx.moveTo(w.x, w.y) : ctx.lineTo(w.x, w.y);
    });
    ctx.closePath();
    for (let i = crustIn.length - 1; i >= 0; i--) {
      const w = toWorld(crustIn[i]);
      i === crustIn.length - 1 ? ctx.moveTo(w.x, w.y) : ctx.lineTo(w.x, w.y);
    }
    ctx.closePath();
    ctx.fillStyle = pal.crustRing;
    ctx.fill();

    // ----- Crust outline -----
    pathFrom(outer);
    ctx.strokeStyle = pal.outline;
    ctx.lineWidth   = 3;
    ctx.stroke();

    // ----- 3D crust shading — fixed world-space light from
    // upper-left, independent of this pizza's own tilt -----
    pathFrom(outer);
    const crustGrad = ctx.createRadialGradient(
      world.x - maxR * 0.35, world.y - maxR * 0.35, maxR * 0.05,
      world.x, world.y, maxR
    );
    crustGrad.addColorStop(0,   'rgba(255,255,255,0.22)');
    crustGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
    crustGrad.addColorStop(1,   'rgba(0,0,0,0.28)');
    ctx.fillStyle = crustGrad;
    ctx.fill();

    // ----- Sauce — fills the crust's inner boundary -----
    pathFrom(crustIn);
    ctx.fillStyle = pal.sauce;
    ctx.fill();

    // ----- Cheese base -----
    pathFrom(cheese);
    ctx.fillStyle = pal.cheese;
    ctx.fill();

    // ----- Cheese blobs -----
    [{dx:-.2,dy:-.3,rx:.28,ry:.18,a:.4},{dx:.3,dy:.1,rx:.22,ry:.16,a:-.3},
     {dx:-.1,dy:.35,rx:.25,ry:.14,a:.8},{dx:.1,dy:-.1,rx:.3,ry:.2,a:.1}]
    .forEach(b => {
      ctx.save(); ctx.translate(world.x+shape.rx*b.dx, world.y+shape.rx*b.dy); ctx.rotate(b.a+shape.rot);
      ctx.beginPath(); ctx.ellipse(0,0,shape.rx*b.rx,shape.rx*b.ry,0,0,Math.PI*2);
      ctx.fillStyle=pal.cheeseBlob; ctx.fill(); ctx.restore();
    });

    // ----- 3D cheese shading -----
    pathFrom(cheese);
    const cheeseGrad = ctx.createRadialGradient(
      world.x - maxR * 0.3, world.y - maxR * 0.3, maxR * 0.05,
      world.x, world.y, maxR * 0.78
    );
    cheeseGrad.addColorStop(0,   'rgba(255,255,255,0.18)');
    cheeseGrad.addColorStop(0.6, 'rgba(0,0,0,0)');
    cheeseGrad.addColorStop(1,   'rgba(0,0,0,0.2)');
    ctx.fillStyle = cheeseGrad;
    ctx.fill();

    // ----- Slice lines — from the centroid out to the crust's
    // inner edge, at six evenly spaced true angles so each line
    // actually meets the boundary square-on like a real cut -----
    const crustAngles = withAngles(crustIn, centroid);
    for (let i = 0; i < 6; i++) {
      const edge = toWorld(pointAtAngle(crustAngles, (i / 6) * Math.PI * 2));
      ctx.beginPath();
      ctx.moveTo(world.x, world.y);
      ctx.lineTo(edge.x, edge.y);
      ctx.strokeStyle = pal.outline;
      ctx.lineWidth   = 2;
      ctx.stroke();
    }

    // ----- Pepperoni — placed inside the cheese boundary by
    // looking up its actual edge at a random true angle, then
    // stepping in from there, so toppings respect the pizza's
    // own shape -----
    const cheeseAngles = withAngles(cheese, centroid);
    const placed = [];
    let attempts = 0;
    while (placed.length < pepperoniCount && attempts < 200) {
      attempts++;
      const edgePt = pointAtAngle(cheeseAngles, Math.random() * Math.PI * 2);
      const reach  = Math.sqrt(Math.random()) * 0.88;
      const lx     = centroid.x + (edgePt.x - centroid.x) * reach;
      const ly     = centroid.y + (edgePt.y - centroid.y) * reach;
      const pr      = shape.rx * (0.07 + Math.random() * 0.09);
      const squashX = 0.7 + Math.random() * 0.6;
      const squashY = 0.7 + Math.random() * 0.6;
      const tilt    = Math.random() * Math.PI;
      const tooClose = placed.some(q => {
        const dx = lx - q.lx, dy = ly - q.ly;
        return Math.sqrt(dx*dx + dy*dy) < pr + q.pr + 2;
      });
      if (!tooClose) placed.push({ lx, ly, pr, squashX, squashY, tilt });
    }

    placed.forEach(({ lx, ly, pr, squashX, squashY, tilt }) => {
      const { x: px, y: py } = toWorld({ x: lx, y: ly });

      // Flat disc + outline only — no gradient shading or offset
      // shadow, so these read as printed shapes, not 3D beads
      ctx.save(); ctx.translate(px,py); ctx.rotate(tilt);
      ctx.beginPath(); ctx.ellipse(0,0,pr*squashX,pr*squashY,0,0,Math.PI*2);
      ctx.fillStyle=pal.pepperoni; ctx.fill();
      ctx.strokeStyle=pal.outline; ctx.lineWidth=1.5; ctx.stroke();
      ctx.restore();
    });

    // ----- Specular highlight — the grease shine, fixed
    // world-space light direction -----
    const shinGrad = ctx.createRadialGradient(
      world.x - maxR*0.28, world.y - maxR*0.28, 0,
      world.x - maxR*0.28, world.y - maxR*0.28, maxR*0.45
    );
    shinGrad.addColorStop(0,   'rgba(255,255,255,0.18)');
    shinGrad.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = shinGrad;
    ctx.beginPath();
    ctx.ellipse(world.x - maxR*0.28, world.y - maxR*0.28, maxR*0.45, maxR*0.32, -0.5, 0, Math.PI*2);
    ctx.fill();

    // ----- Noise texture -----
    const bx = Math.floor(world.x - maxR - 10);
    const by = Math.floor(world.y - maxR - 10);
    const bw = Math.ceil(maxR*2 + 20);
    const bh = Math.ceil(maxR*2 + 20);
    const id = ctx.getImageData(bx, by, bw, bh);
    const d  = id.data;
    for (let i=0; i<d.length; i+=4) {
      if (d[i+3] > 0) {
        const n = (Math.random()-.5) * NOISE_AMOUNT;
        d[i]   = Math.min(255, Math.max(0, d[i]  +n));
        d[i+1] = Math.min(255, Math.max(0, d[i+1]+n));
        d[i+2] = Math.min(255, Math.max(0, d[i+2]+n));
      }
    }
    ctx.putImageData(id, bx, by);
  }

  // =====================================================
  // PIZZA OBJECTS
  // =====================================================
  const pSize = (PIZZA_RADIUS+45)*2;

  // Random vertical spawn point, full screen height, keeping the
  // pizza's offscreen canvas fully on-screen
  function randomY() {
    const margin = pSize / 2;
    return margin + Math.random() * Math.max(1, H - margin * 2);
  }

  function makePizza() {
    const off    = document.createElement('canvas');
    off.width    = pSize; off.height = pSize;
    const oCtx   = off.getContext('2d');
    const recipe = makePizzaRecipe();
    drawPizza(oCtx, pSize/2, pSize/2, recipe);
    return {
      off, oCtx, recipe,
      r: recipe.shape.rx,
      y: randomY(),
      x: -pSize/2 - randInt(0, W),
      speedNoise: makeSmoother(0.025+Math.random()*.02, 15, 70),
    };
  }

  const pizzas = Array.from(
    {length: randInt(MIN_PIZZAS, MAX_PIZZAS + 1)},
    () => makePizza()
  );

  // =====================================================
  // TAPESTRY CANVAS
  // This is the slit scan output — a single offscreen canvas the
  // full width of the screen (only [SLIT_X, W) of it is ever
  // shown). Each frame we:
  //   1. Shift the scan region one pixel to the right
  //   2. Plant the new slit column at SLIT_X, the freed-up slot
  // Columns that drift off the right edge just disappear.
  // =====================================================
  const tapestry    = document.createElement('canvas');
  tapestry.width    = W;
  tapestry.height   = H;
  const tapestryCtx = tapestry.getContext('2d');
  tapestryCtx.imageSmoothingEnabled = false;

  // Fill with background to start
  tapestryCtx.fillStyle = BG_COLOR;
  tapestryCtx.fillRect(0, 0, W, H);

  // Temp canvas — composite live pizza feed for slit sampling
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width  = W;
  tempCanvas.height = H;
  const tempCtx     = tempCanvas.getContext('2d');
  tempCtx.imageSmoothingEnabled = false;

  // =====================================================
  // MAIN LOOP
  // =====================================================
  function frame() {

    slitMarker.style.left = SLIT_X + 'px';

    // --- Draw all pizzas to temp canvas (live feed) ---
    tempCtx.clearRect(0, 0, W, H);

    // Occasionally let the population grow, up to the cap
    if (pizzas.length < MAX_PIZZAS && Math.random() < 0.006) {
      pizzas.push(makePizza());
    }

    // Iterate backwards so we can retire pizzas mid-loop without
    // disturbing indices we haven't visited yet
    for (let i = pizzas.length - 1; i >= 0; i--) {
      const p = pizzas[i];
      const speed = Math.max(0.15, 0.6 + p.speedNoise() * 2.2);
      p.x += speed;

      if (p.x - p.r > W + 30) {
        // Pizza finished its run — either retire it (shrinking the
        // population) or send it around again from a fresh spot
        if (pizzas.length > MIN_PIZZAS && Math.random() < 0.35) {
          pizzas.splice(i, 1);
          continue;
        }
        p.x      = -pSize/2 - randInt(0, 80);
        p.y      = randomY();
        p.recipe = makePizzaRecipe();
        p.r      = p.recipe.shape.rx;
        p.oCtx.clearRect(0, 0, pSize, pSize);
        drawPizza(p.oCtx, pSize/2, pSize/2, p.recipe);
      }

      tempCtx.drawImage(p.off, Math.round(p.x - pSize/2), Math.round(p.y - pSize/2));
    }

    // --- Update tapestry ---
    // Step 1: shift only the scan region (right of the slit) one
    // pixel to the right, by drawing that sub-rect of the tapestry
    // onto itself offset by 1px. Restricting the source/dest to
    // [SLIT_X, W) keeps the shift from ever reading stale pixels
    // left of the slit (never displayed, never meant to be part of
    // the scan) back into the visible tapestry.
    const scanW = W - SLIT_X;
    tapestryCtx.drawImage(tapestry, SLIT_X, 0, scanW, H, SLIT_X + 1, 0, scanW, H);

    // Step 2: clear the leftmost column of the tapestry (at SLIT_X)
    // so we have a clean slot to plant the new sample
    tapestryCtx.clearRect(SLIT_X, 0, 1, H);

    // Step 3: grab the slit column from the live feed and plant it
    const slitData = tempCtx.getImageData(SLIT_X, 0, 1, H);
    tapestryCtx.putImageData(slitData, SLIT_X, 0);

    // --- Composite to main canvas ---
    ctx.fillStyle = BG_COLOR;
    ctx.fillRect(0, 0, W, H);

    // Draw tapestry (right side of slit)
    ctx.save();
    ctx.beginPath();
    ctx.rect(SLIT_X, 0, W - SLIT_X, H);
    ctx.clip();
    ctx.drawImage(tapestry, 0, 0);
    ctx.restore();

    // Draw live pizzas clipped strictly to left of slit
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, SLIT_X, H);
    ctx.clip();
    pizzas.forEach(p => {
      ctx.drawImage(p.off, Math.round(p.x - pSize/2), Math.round(p.y - pSize/2));
    });
    ctx.restore();

    // Ghost slit line
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(SLIT_X, 0, 1, H);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  window.addEventListener('resize', () => {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.imageSmoothingEnabled = false;
    W      = canvas.width;
    H      = canvas.height;
    SLIT_X = Math.floor(W * 0.35);

    // The tapestry/temp canvases were sized off the initial W/H —
    // without this they'd silently stay the old dimensions, which
    // desyncs every coordinate downstream of them (the slit shift,
    // the composite draws) from the resized main canvas. Resizing
    // clears their contents, so the scan history restarts.
    tapestry.width  = W;
    tapestry.height = H;
    tapestryCtx.imageSmoothingEnabled = false;
    tapestryCtx.fillStyle = BG_COLOR;
    tapestryCtx.fillRect(0, 0, W, H);

    tempCanvas.width  = W;
    tempCanvas.height = H;
    tempCtx.imageSmoothingEnabled = false;
  });
</script>
</body>
</html>
